name: Daily update

on:
  schedule:
    - cron: "30 18 * * 1-5"   # 18:30 UTC, Mon-Fri, after European markets close
  workflow_dispatch:           # adds a "Run workflow" button on GitHub
  push:                        # also recompute when you push new manual prices
    paths:
      - data/manual_prices.csv
      - config/portfolios.yaml

permissions:
  contents: write              # allows the job to commit the new data

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m tracker.update
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898708+github-actions[bot]@users.noreply.github.com"
          git add data/positions.csv data/market.csv
          git diff --staged --quiet || git commit -m "Daily data update $(date -u +%F)"
          git push